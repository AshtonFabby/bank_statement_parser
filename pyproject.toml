[project]
name = "bank-statement-parser"
version = "0.1.0"
description = "Bank statement parser API and utilities"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.6.17",
    "fastapi[standard]>=0.139.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "uvicorn[standard]>=0.51.0",
    "uvicorn-worker>=0.4.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
